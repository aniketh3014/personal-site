# Every run: lint, build, link check, CSP check, secret scan.
# Pull requests also run Lighthouse. Pushes to main deploy the checked
# dist/ to Cloudflare (see wrangler.jsonc); a failing check blocks it.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Build and checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Renders Mermaid at build time; also used by the CSP and Lighthouse checks.
      - name: Install Chromium
        run: npx playwright install --with-deps --no-shell chromium

      - name: Lint (Prettier, ESLint, markdownlint)
        run: npm run format:check && npm run lint && npm run lint:md

      - name: Build
        run: npm run build

      - name: Broken links
        run: npm run check:links

      - name: CSP check
        run: npm run check:csp

      # The slowest check; scores don't drift push to push, so PRs only.
      - name: Lighthouse CI
        if: github.event_name == 'pull_request'
        run: npm run check:lighthouse

      - name: Upload site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist/
          retention-days: 7
          if-no-files-found: error

  gitleaks:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # lists the PR's commits to scan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pin the scanner instead of the action's default (8.24.3), matching
          # local scans. Note: a repo's very first push includes the root
          # commit, which has no parent, so the action's "<first>^..<last>"
          # range is invalid and the scan errors; later pushes are fine.
          GITLEAKS_VERSION: "8.30.1"
          # PR comments would need pull-requests: write; the job summary is enough.
          GITLEAKS_ENABLE_COMMENTS: false

  deploy:
    name: Deploy to Cloudflare
    needs: [checks, gitleaks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    environment:
      name: production
      url: https://aniketghosh.in
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist

      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.151.3"
          command: deploy --message=${{ github.sha }}
